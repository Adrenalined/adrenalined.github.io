<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prot Warrior BiS Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one dark "tooltip parchment" column; each slot is a compact ranked table, item left / source right. Deliberately single dark theme so quality colors read like in-game. */
:root {
  --bg: #0d0f14;
  --panel: #151922;
  --edge: #2a3140;
  --fg: #d9dbe2;
  --muted: #8790a3;
  --gold: #ffd100;
  --q2: #1eff00; /* Uncommon */
  --q3: #0070dd; /* Rare */
  --q4: #a335ee; /* Epic */
  --q3-text: #3a95ff;
  --link: #9fb4d9;
  --display: "Cinzel", Georgia, serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.wrap {
  max-width: 900px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header h1 { font-family: var(--display); color: var(--gold); font-size: 1.75rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
header a { color: var(--link); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span b { font-weight: 600; }
.q2 { color: var(--q2); } .q3 { color: var(--q3-text); } .q4 { color: var(--q4); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
section { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; min-width: 0; }
section h2 {
  font-family: var(--display); font-size: .95rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--edge);
}
table { width: 100%; border-collapse: collapse; }
td { padding: 7px 14px; vertical-align: top; line-height: 1.35; }
tr + tr td { border-top: 1px solid #1e2430; }
td.rank { width: 1%; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-right: 4px; padding-top: 9px; }
tr.bis td.rank { color: var(--gold); font-weight: 600; }
tr.bis td.item a { font-weight: 600; }
td.item { white-space: nowrap; }
td.item a { text-decoration: none; }
td.item a:hover, td.item a:focus-visible { text-decoration: underline; }
td.src { text-align: right; color: var(--muted); font-size: 13px; }
td.src a { color: var(--link); text-decoration: none; border-bottom: 1px dotted #4a5670; }
td.src a:hover, td.src a:focus-visible { color: #cfdcf5; }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
@media (max-width: 480px) { td { padding: 7px 10px; } td.src { font-size: 12px; } td.item { white-space: normal; } }
</style>
<script>const whTooltips = {colorLinks: true, iconizeLinks: true, renameLinks: false, iconSize: 'small'};</script>
<script src="https://wow.zamimg.com/js/tooltips.js"></script>
</head>
